<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acceso administrativo | Dulces Veracruzanos</title>

    <link rel="stylesheet" href="../css/login.css">

    <script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <img src="../img/logo.png"
                 alt="Dulces Típicos Veracruzanos"
                 class="logo">

            <span class="badge">ÁREA ADMINISTRATIVA</span>

            <h1>Bienvenida</h1>

            <p class="description">
                Introduce tu PIN para acceder al sistema
                de administración del negocio.
            </p>

            <form id="form-login">

                <label for="pin">PIN de acceso</label>

                <div class="pin-container">

                    <input type="password"
                           id="pin"
                           placeholder="••••"
                           maxlength="4"
                           minlength="4"
                           pattern="[0-9]{4}"
                           inputmode="numeric"
                           autocomplete="off"
                           required>

                    <button type="button"
                            id="mostrar-pin">
                        Mostrar
                    </button>

                </div>

                <p id="mensaje-error" role="alert"></p>

                <button type="submit" class="btn-login">
                    Iniciar sesión
                </button>

            </form>

            <a href="../index.html" class="back-link">
                ← Volver a la tienda
            </a>

            <div class="footer">
                Dulces Típicos Veracruzanos
                <br>
                Sistema de gestión administrativa
            </div>

        </div>

    </main>

</body>
</html>
