<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | Dulces Veracruzanos</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="brand">
        <img src="img/logo.png" alt="Logo">
        <span>Dulces Típicos Veracruzanos</span>
    </a>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="catalogo.html" class="active">Catálogo</a>

        <a href="carrito.html">
            Mi pedido (<span id="contador">0</span>)
        </a>
    </nav>

</header>

<main class="section">

    <div class="section-title">

        <span>Nuestros sabores</span>

        <h2>Catálogo de productos</h2>

        <p>
            Selecciona tus dulces favoritos y realiza
            tu pedido.
        </p>

    </div>

    <input
        type="search"
        id="buscador"
        class="search-box"
        placeholder="Buscar un dulce..."
        aria-label="Buscar productos"
    >

    <div class="products-grid" id="productos"></div>

</main>

<footer>
    <p>Dulces Típicos Veracruzanos</p>
    <p>Un pedacito de Veracruz en cada bocado.</p>
</footer>

<script src="js/supabase.js"></script>
<script src="js/productos.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
